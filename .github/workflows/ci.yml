name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqr
          POSTGRES_PASSWORD: pqr
          POSTGRES_DB: sistema_pqr
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pqr -d sistema_pqr"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SECRET_KEY: ci-secret
      ADMIN_PASS: ci-admin-pass
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pqr
      PGPASSWORD: pqr
      PGDATABASE: sistema_pqr
      PGSSLMODE: disable
      SESSION_COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
