<!DOCTYPE html>
<html lang="es">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<head>

<meta charset="UTF-8">

<title>Dashboard Ejecutivo</title>

<style>
    .charts{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:25px;

    margin-top:35px;

}

.chart-card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    height:380px;
    position:relative;
    overflow:hidden;
}

.chart-card canvas{
    width:100% !important;
    height:320px !important;
}

.chart-card h3{

    margin-top:0;

    color:#173b74;

    margin-bottom:20px;

}

body{
    font-family:Arial;
    background:#f4f7fb;
    margin:30px;
}

h1{
    color:#173b74;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:30px;
}

.card{

    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);

}

.numero{

    font-size:34px;
    font-weight:bold;
    color:#173b74;

}

.titulo{

    color:#666;
    margin-top:8px;

}

</style>

</head>

<body>

<h1>Dashboard Ejecutivo</h1>

<div class="grid">

    <div class="card">
        <div id="total" class="numero">0</div>
        <div class="titulo">Total PQR</div>
    </div>

    <div class="card">
        <div id="abiertas" class="numero">0</div>
        <div class="titulo">Abiertas</div>
    </div>

    <div class="card">
        <div id="cerradas" class="numero">0</div>
        <div class="titulo">Cerradas</div>
    </div>

    <div class="card">
        <div id="alta" class="numero">0</div>
        <div class="titulo">Prioridad Alta</div>
    </div>

</div>
<div class="charts">

    <div class="chart-card">
        <h3>PQR por Estado</h3>
        <canvas id="grafEstados"></canvas>
    </div>

    <div class="chart-card">
        <h3>PQR por Tipo de Solicitud</h3>
        <canvas id="grafTipos"></canvas>
    </div>

</div>

<script>

fetch("/api/dashboard")

.then(r=>r.json())

.then(d=>{
    alert("Llegó al dashboard");

    console.log(JSON.stringify(d,null,2));

    document.getElementById("total").innerHTML = d.total;
    alert(document.getElementById("total").innerHTML);
    console.log(document.getElementById("grafEstados"));
    console.log(document.getElementById("grafTipos"));

document.getElementById("abiertas").innerHTML =
    (d.estados["Recibido"] || 0) +
    (d.estados["Radicado"] || 0) +
    (d.estados["En revisión"] || 0) +
    (d.estados["En investigación"] || 0);

document.getElementById("cerradas").innerHTML =
    d.estados["Cerrado"] || 0;

document.getElementById("alta").innerHTML =
    d.prioridades["Alta"] || 0;
    document.getElementById("alta").innerHTML =
    d.prioridades["Alta"] || 0;


// ======= GRÁFICO ESTADOS =======

new Chart(document.getElementById("grafEstados"),{

    type:"bar",

    data:{

        labels:Object.keys(d.estados),

        datasets:[{

            label:"PQR",

            data:Object.values(d.estados),

            backgroundColor:"#1f4f99"

        }]

    }

});


// ======= GRÁFICO TIPOS =======

new Chart(document.getElementById("grafTipos"),{

    type:"pie",

    data:{

        labels:Object.keys(d.tipos),

        datasets:[{

            data:Object.values(d.tipos),

            backgroundColor:[
                "#1f4f99",
                "#4CAF50",
                "#FFC107",
                "#E53935",
                "#8E24AA",
                "#26A69A"
            ]

        }]

    }

});

});

</script>

</body>

</html>
