# Desarrollo: se aplica automáticamente con `docker compose up`.
# En producción/CI usar: docker compose -f docker-compose.yml up
services:
  db:
    ports:
      - "127.0.0.1:3307:3306"

  web:
    build:
      context: .
      args:
        INSTALL_DEV: "1"
    command: python -m flask --app wsgi run --debug --host 0.0.0.0 --port 8000
    environment:
      FLASK_DEBUG: "1"
      TRUST_PROXY: "0"
    volumes:
      - .:/app
      - evidencias:/data/evidencias
