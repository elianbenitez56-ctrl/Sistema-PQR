services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-sistema_pqr}
      POSTGRES_USER: ${PGUSER:-pqr}
      POSTGRES_PASSWORD: ${PGPASSWORD:?defina PGPASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-pqr} -d ${PGDATABASE:-sistema_pqr}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGSSLMODE: disable
      PORT: "8000"  # puerto interno; el externo se elige con PORT en .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - evidencias:/data/evidencias
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  evidencias:
