services:
  - type: web
    name: sistema-pqr
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Sin disco de evidencias local: use SUPABASE_URL/SUPABASE_SERVICE_KEY abajo, o
    # (plan de pago) descomente este disco:
    # disk:
    #   name: evidencias
    #   mountPath: /data/evidencias
    #   sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASS
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGSSLMODE
        value: require
      # Render bloquea los puertos SMTP salientes: el envío usa la API de Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PQR_URL_BASE
        value: https://sistema-pqr.onrender.com
      - key: CATALOGO_PRODUCTOS_PATH
        value: datos/LISTADO PRODUCTOS.xlsx
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: evidencias
