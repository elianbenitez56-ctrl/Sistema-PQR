services:
  - type: web
    name: sistema-pqr
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Sin disco (plan Free) las evidencias se pierden en cada deploy; con plan de pago descomente:
    # disk:
    #   name: evidencias
    #   mountPath: /data/evidencias
    #   sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASS
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: sistema_pqr
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PQR_URL_BASE
        value: https://sistema-pqr.onrender.com
      - key: CATALOGO_PRODUCTOS_PATH
        value: datos/LISTADO PRODUCTOS.xlsx
