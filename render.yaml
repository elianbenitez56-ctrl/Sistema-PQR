services:
  - type: web
    name: sistema-pqr
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Sin disco (plan Free) las evidencias se pierden en cada deploy; con plan de pago descomente:
    # disk:
    #   name: evidencias
    #   mountPath: /data/evidencias
    #   sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASS
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGSSLMODE
        value: require
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PQR_URL_BASE
        value: https://sistema-pqr.onrender.com
      - key: CATALOGO_PRODUCTOS_PATH
        value: datos/LISTADO PRODUCTOS.xlsx
